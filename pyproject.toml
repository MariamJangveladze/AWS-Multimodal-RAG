[project]
name = "aws-multimodal-rag"
version = "0.1.0"
description = "Production-style multilingual multimodal RAG backend using Amazon Bedrock, S3, and FAISS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.40,<2",
  "faiss-cpu>=1.12,<2",
  "numpy>=2.2,<3",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
rag-eval = "aws_multimodal_rag.eval_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_multimodal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
